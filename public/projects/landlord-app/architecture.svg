<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="70" font-size="34" font-weight="700" fill="#0a0a0a">The Landlord App — architecture at a glance</text>
  <text x="64" y="106" font-size="19" fill="#71717a">Two roles, one platform — with data access enforced at the database layer, not the interface.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== Top: request flow ===== -->
  <text x="64" y="168" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1.5">HOW A REQUEST FLOWS</text>

  <!-- actors -->
  <rect x="64" y="192" width="180" height="56" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="226" font-size="20" font-weight="600" fill="#0a0a0a">Landlord</text>
  <rect x="64" y="268" width="180" height="56" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="84" y="302" font-size="20" font-weight="600" fill="#0a0a0a">Tenant</text>
  <text x="64" y="352" font-size="14" fill="#71717a">Separate roles, separate experiences</text>

  <line x1="244" y1="220" x2="360" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="244" y1="296" x2="360" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- app -->
  <rect x="364" y="205" width="250" height="110" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="388" y="256" font-size="22" font-weight="600" fill="#0a0a0a">Landlord App</text>
  <text x="388" y="284" font-size="16" fill="#71717a">Next.js · React · TS</text>
  <text x="388" y="306" font-size="14" fill="#94a3b8">on Vercel</text>

  <line x1="614" y1="260" x2="700" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- supabase -->
  <rect x="704" y="185" width="512" height="150" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="728" y="222" font-size="18" font-weight="700" fill="#0a0a0a">Supabase</text>
  <rect x="728" y="238" width="130" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="748" y="272" font-size="16" font-weight="600" fill="#0a0a0a">Auth</text>
  <text x="748" y="294" font-size="13" fill="#71717a">roles</text>
  <rect x="872" y="238" width="180" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="892" y="268" font-size="16" font-weight="600" fill="#1e3a8a">PostgreSQL</text>
  <text x="892" y="292" font-size="13" fill="#3b82f6">Row Level Security</text>
  <rect x="1066" y="238" width="130" height="74" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1086" y="272" font-size="16" font-weight="600" fill="#0a0a0a">Storage</text>
  <text x="1086" y="294" font-size="13" fill="#71717a">documents</text>

  <text x="704" y="358" font-size="14.5" fill="#71717a">Authorisation is enforced here, not in the interface —</text>
  <text x="704" y="380" font-size="14.5" fill="#71717a">so a tenant can never read another tenancy's data.</text>

  <line x1="64" y1="410" x2="1216" y2="410" stroke="#f1f5f9" stroke-width="2"/>

  <!-- ===== Bottom: data model ===== -->
  <text x="64" y="452" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1.5">DATA MODEL — BUILT AROUND THE TENANCY</text>

  <!-- chain -->
  <rect x="64" y="486" width="150" height="60" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="86" y="523" font-size="18" font-weight="600" fill="#0a0a0a">Landlord</text>
  <line x1="214" y1="516" x2="252" y2="516" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="256" y="486" width="150" height="60" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="278" y="523" font-size="18" font-weight="600" fill="#0a0a0a">Property</text>
  <line x1="406" y1="516" x2="444" y2="516" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="448" y="482" width="164" height="68" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="472" y="513" font-size="19" font-weight="700" fill="#1e3a8a">Tenancy</text>
  <text x="472" y="534" font-size="12.5" fill="#3b82f6">begins &amp; ends</text>
  <line x1="612" y1="516" x2="650" y2="516" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="654" y="486" width="150" height="60" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="676" y="523" font-size="18" font-weight="600" fill="#0a0a0a">Tenant</text>

  <!-- tenancy owns -->
  <line x1="530" y1="550" x2="530" y2="600" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <g>
    <rect x="654" y="586" width="132" height="52" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="674" y="618" font-size="15" font-weight="500" fill="#0a0a0a">Documents</text>
    <rect x="800" y="586" width="120" height="52" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="820" y="618" font-size="15" font-weight="500" fill="#0a0a0a">Rent</text>
    <rect x="934" y="586" width="150" height="52" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="954" y="618" font-size="15" font-weight="500" fill="#0a0a0a">Maintenance</text>
    <rect x="1098" y="586" width="118" height="52" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="1118" y="618" font-size="15" font-weight="500" fill="#0a0a0a">Messages</text>
  </g>
  <path d="M 530 612 L 654 612" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <text x="64" y="676" font-size="14.5" fill="#71717a">Documents, rent, maintenance and messages all live within a tenancy — so history is preserved as tenants change over time.</text>
</svg>
