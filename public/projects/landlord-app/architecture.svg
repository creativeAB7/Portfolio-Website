<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="66" font-size="33" font-weight="700" fill="#0a0a0a">The Landlord App — a two-sided platform</text>
  <text x="64" y="102" font-size="18.5" fill="#71717a">Two roles, one shared system — built around collaboration between landlords and tenants.</text>

  <!-- legend: the two sides -->
  <circle cx="986" cy="58" r="6" fill="#2563eb"/>
  <text x="1000" y="63" font-size="14" fill="#71717a">Landlord</text>
  <circle cx="1096" cy="58" r="6" fill="#0d9488"/>
  <text x="1110" y="63" font-size="14" fill="#71717a">Tenant</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== Top: two sides into one platform ===== -->
  <text x="64" y="158" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1.5">TWO SIDES, ONE SHARED PLATFORM</text>

  <!-- landlord role -->
  <rect x="64" y="180" width="204" height="58" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="80" y="194" width="5" height="30" rx="2.5" fill="#2563eb"/>
  <text x="100" y="206" font-size="19" font-weight="600" fill="#0a0a0a">Landlord</text>
  <text x="100" y="227" font-size="13" fill="#71717a">their own dashboard</text>

  <!-- tenant role -->
  <rect x="64" y="252" width="204" height="58" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="80" y="266" width="5" height="30" rx="2.5" fill="#0d9488"/>
  <text x="100" y="278" font-size="19" font-weight="600" fill="#0a0a0a">Tenant</text>
  <text x="100" y="299" font-size="13" fill="#71717a">their own portal</text>

  <text x="64" y="340" font-size="13.5" fill="#94a3b8">Two roles · two tailored experiences</text>

  <!-- arrows into app -->
  <line x1="268" y1="209" x2="376" y2="238" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="268" y1="281" x2="376" y2="262" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- app -->
  <rect x="380" y="196" width="236" height="108" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="404" y="238" font-size="21" font-weight="600" fill="#0a0a0a">Landlord App</text>
  <text x="404" y="266" font-size="15" fill="#71717a">Next.js · React · TS</text>
  <text x="404" y="288" font-size="13" fill="#94a3b8">on Vercel</text>

  <line x1="616" y1="250" x2="704" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- supabase -->
  <rect x="708" y="178" width="508" height="144" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="732" y="212" font-size="18" font-weight="700" fill="#0a0a0a">Supabase</text>
  <rect x="732" y="226" width="128" height="78" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="752" y="260" font-size="16" font-weight="600" fill="#0a0a0a">Auth</text>
  <text x="752" y="282" font-size="12.5" fill="#71717a">roles &amp; sessions</text>
  <rect x="874" y="226" width="180" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="894" y="258" font-size="16" font-weight="600" fill="#1e3a8a">PostgreSQL</text>
  <text x="894" y="282" font-size="12.5" fill="#3b82f6">Row Level Security</text>
  <rect x="1068" y="226" width="128" height="78" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1088" y="260" font-size="16" font-weight="600" fill="#0a0a0a">Storage</text>
  <text x="1088" y="282" font-size="12.5" fill="#71717a">documents</text>

  <text x="708" y="346" font-size="14.5" fill="#71717a">Each side sees only its own world — a tenant can never reach another</text>
  <text x="708" y="368" font-size="14.5" fill="#71717a">tenancy's data, because that boundary lives in the database, not the interface.</text>

  <line x1="64" y1="410" x2="1216" y2="410" stroke="#f1f5f9" stroke-width="2"/>

  <!-- ===== Bottom: shared tenancy ===== -->
  <text x="64" y="452" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1.5">BUILT AROUND A SHARED TENANCY</text>

  <!-- landlord -->
  <rect x="64" y="482" width="150" height="58" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="80" y="497" width="5" height="28" rx="2.5" fill="#2563eb"/>
  <text x="100" y="518" font-size="17" font-weight="600" fill="#0a0a0a">Landlord</text>

  <line x1="214" y1="511" x2="258" y2="511" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- property -->
  <rect x="262" y="482" width="140" height="58" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="284" y="518" font-size="17" font-weight="600" fill="#0a0a0a">Property</text>

  <text x="410" y="502" font-size="12.5" fill="#94a3b8">lets</text>
  <line x1="402" y1="511" x2="452" y2="511" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- tenancy hub -->
  <rect x="456" y="472" width="190" height="78" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="506" font-size="19" font-weight="700" fill="#1e3a8a">Tenancy</text>
  <text x="480" y="528" font-size="12.5" fill="#3b82f6">the shared space</text>

  <text x="662" y="502" font-size="12.5" fill="#94a3b8">occupies</text>
  <line x1="742" y1="511" x2="646" y2="511" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- tenant -->
  <rect x="746" y="482" width="150" height="58" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="762" y="497" width="5" height="28" rx="2.5" fill="#0d9488"/>
  <text x="782" y="518" font-size="17" font-weight="600" fill="#0a0a0a">Tenant</text>

  <!-- workflows inside the tenancy -->
  <line x1="551" y1="550" x2="551" y2="580" stroke="#94a3b8" stroke-width="2"/>
  <line x1="367" y1="580" x2="850" y2="580" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="367" y1="580" x2="367" y2="596" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="522" y1="580" x2="522" y2="596" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="680" y1="580" x2="680" y2="596" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="850" y1="580" x2="850" y2="596" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="292" y="596" width="150" height="52" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="367" y="628" font-size="15" font-weight="500" fill="#0a0a0a" text-anchor="middle">Documents</text>
  <rect x="466" y="596" width="112" height="52" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="522" y="628" font-size="15" font-weight="500" fill="#0a0a0a" text-anchor="middle">Rent</text>
  <rect x="600" y="596" width="160" height="52" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="680" y="628" font-size="15" font-weight="500" fill="#0a0a0a" text-anchor="middle">Maintenance</text>
  <rect x="782" y="596" width="136" height="52" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="850" y="628" font-size="15" font-weight="500" fill="#0a0a0a" text-anchor="middle">Messages</text>

  <text x="64" y="690" font-size="14.5" fill="#71717a">Documents, rent, maintenance and messages all live inside the tenancy — the shared record both sides see, preserved as tenants change over time.</text>
</svg>
